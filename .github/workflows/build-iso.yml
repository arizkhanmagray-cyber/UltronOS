name: Build ISO

# Builds the installable Ultron OS image.
#   * every push that changes the OS definition -> ISO as a workflow artifact
#   * a tag like v1.0                           -> GitHub Release with the ISO (in parts if over 2 GiB)
#   * "Run workflow" button                     -> on demand; tick "release" to publish one
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version string baked into the image
        default: "1.0"
      release:
        description: Also publish a GitHub Release (tag v<version>) with the ISO attached
        type: boolean
        default: false
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "live-build/**"
      - "scripts/build-iso.sh"
      - "scripts/publish-release.sh"
      - "build.sh"
      - ".github/workflows/build-iso.yml"

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # only used to attach the ISO to a release on tag builds

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null || true
          df -h /

      - name: Work out the version
        id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version }}" ]; then v="${{ inputs.version }}"
          else v="1.0"; fi
          echo "version=${v}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          ULTRON_VERSION: ${{ steps.v.outputs.version }}
          ULTRON_COMPRESSION: xz
        run: sudo -E ./build.sh

      - name: Show result
        run: |
          # the build ran as root; later steps write next to the ISO
          sudo chown -R "$(id -u):$(id -g)" out
          ls -lh out/
          cat out/*.sha256

      - name: Upload ISO (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ultronos-${{ steps.v.outputs.version }}-amd64
          path: |
            out/*.iso
            out/*.sha256
          compression-level: 0
          retention-days: 14

      - name: Publish the release
        if: github.ref_type == 'tag' || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          # A tag build releases that tag; a manual run creates tag v<version>
          # on the commit that was built.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then tag="${GITHUB_REF_NAME}"; else tag="v${VERSION}"; fi
          RELEASE_TARGET="${GITHUB_SHA}" scripts/publish-release.sh "${tag}" "${VERSION}"
