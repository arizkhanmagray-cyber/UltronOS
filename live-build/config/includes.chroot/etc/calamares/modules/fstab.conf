---
mountOptions:
    default: defaults,noatime
    btrfs: defaults,noatime,compress=zstd
# No continuous "discard": Debian's weekly fstrim.timer does the same job
# without the write-latency cost.
ssdExtraMountOptions:
    swap: discard
efiMountOptions: umask=0077
crypttabOptions: luks,discard,keyscript=/bin/cat
