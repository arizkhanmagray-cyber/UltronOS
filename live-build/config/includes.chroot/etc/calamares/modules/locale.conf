---
region:                 "America"
zone:                   "New_York"
useSystemTimezone:      false
localeGenPath:          "/etc/locale.gen"
# Pre-selects the time zone from the public IP so most people only click
# "Next". Remove this block to keep the installer fully offline.
geoip:
    style:    "json"
    url:      "https://geoip.kde.org/v1/calamares"
    selector: ""
