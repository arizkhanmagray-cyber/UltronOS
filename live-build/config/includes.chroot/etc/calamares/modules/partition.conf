---
efiSystemPartition:     "/boot/efi"
efiSystemPartitionSize: 512M
efiSystemPartitionName: EFI

# zram (compressed swap in RAM) is always on, so a disk swap is optional.
userSwapChoices:
    - none
    - file
initialSwapChoice:      none

drawNestedPartitions:       false
alwaysShowPartitionLabels:  true
allowManualPartitioning:    true

# Nothing is pre-selected: the person must pick "Erase disk",
# "Install alongside" or "Replace a partition" themselves.
initialPartitioningChoice:  none

defaultFileSystemType:      "ext4"
availableFileSystemTypes:   ["ext4", "btrfs"]

# Full-disk encryption is not offered in 1.0 (untested in this image).
enableLuksAutomatedPartitioning: false
