---
userGroup:       users
defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - lpadmin
    - scanner
    - bluetooth
autologinGroup:  autologin
doAutologin:     false
sudoersGroup:    sudo
# Like Windows and macOS: one admin account, no separate root password.
setRootPassword: false
doReusePassword: false
passwordRequirements:
    nonempty: true
    minLength: -1
    maxLength: -1
    libpwquality:
        - minlen=0
        - minclass=0
allowWeakPasswords:        true
allowWeakPasswordsDefault: true
user:
    shell: /bin/bash
    forbidden_names: [ root, ultron-live ]
hostname:
    location: EtcFile
    writeHostsFile: true
    template: "${first}-ultron"
    forbidden_names: [ localhost ]
