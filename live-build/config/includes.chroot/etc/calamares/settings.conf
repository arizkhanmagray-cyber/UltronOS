# Ultron OS installer flow.
# Six questions (language, region, keyboard, disk, account, confirm), then it
# copies the live system to disk and makes it bootable.
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id:      finalize
  module:  shellprocess
  config:  shellprocess-finalize.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - grubcfg
  - bootloader
  - shellprocess@finalize
  - packages
  - initramfscfg
  - initramfs
  - umount
- show:
  - finished

branding: ultronos

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
