# Tuned for zram: swapping to compressed RAM is cheap, so prefer it over
# dropping file cache (which causes disk reads and UI stutter).
vm.swappiness = 150
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.vfs_cache_pressure = 60
# Smoother writes on slow SATA SSDs / HDDs: flush earlier, in smaller chunks.
vm.dirty_background_ratio = 5
vm.dirty_ratio = 15
