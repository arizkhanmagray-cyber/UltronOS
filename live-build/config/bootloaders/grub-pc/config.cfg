set default=0
set timeout=5

# The font ships next to grub.cfg on the ISO; fall back to GRUB's default path.
if loadfont $prefix/unicode.pf2 ; then
    true
else
    loadfont unicode
fi

set gfxmode=auto
set gfxpayload=keep
insmod all_video
insmod gfxterm
insmod png
terminal_output gfxterm

source /boot/grub/theme.cfg
