source /boot/grub/config.cfg

menuentry "Start Ultron OS" --hotkey=s {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}
menuentry "Start Ultron OS (safe graphics)" --hotkey=g {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ nomodeset
	initrd	@INITRD_LIVE@
}
menuentry "Start Ultron OS (show boot messages)" --hotkey=v {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ plymouth.enable=0 systemd.show_status=1 loglevel=6
	initrd	@INITRD_LIVE@
}
if [ "${grub_platform}" = "efi" ]; then
	menuentry "UEFI firmware settings" --hotkey=f {
		fwsetup
	}
fi
